[project]
name = "pedantry"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.21.1",
]

[tool.ruff]
# Target Python 3.14+ (adjust as needed for your projects)
target-version = "py314"

# Same as Black
line-length = 88

# Exclude common directories
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "node_modules",
    "dist",
    "build",
    ".pytest_cache",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable pycodestyle (`E`), pyflakes (`F`), isort (`I`), and more
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
]

# Ignore specific rules if needed
ignore = []

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Like Black, respect magic trailing commas
skip-magic-trailing-comma = false

# Like Black, automatically detect line ending
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]

[tool.pyright]
# Python version
pythonVersion = "3.14"

# Paths
include = ["src"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    ".venv",
    "venv",
    "dist",
    "build",
]

# Type checking mode
typeCheckingMode = "standard"  # "off", "basic", "standard", or "strict"

# Report settings
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedClass = true
reportUnusedFunction = true
reportUnusedVariable = true
reportDuplicateImport = true
reportOptionalMemberAccess = true
reportOptionalSubscript = true
reportPrivateImportUsage = true

# Additional strict options (uncomment for stricter checking)
# reportConstantRedefinition = true
# reportIncompatibleMethodOverride = true
# reportIncompatibleVariableOverride = true
# reportUntypedFunctionDecorator = true
# reportUntypedClassDecorator = true

[tool.vulture]
# Minimum confidence for reporting unused code (0-100)
min_confidence = 80

# Ignore certain patterns
ignore_names = [
    "*_test.py",
    "test_*.py",
]

# Paths to exclude
exclude = [
    ".venv/",
    "venv/",
    "node_modules/",
    "migrations/",  # Django migrations
]

[tool.django-upgrade]
# Target Django version
target-version = "5.1"

[tool.pyupgrade]
# Already handled by Ruff's UP rules, but keeping for reference
# This tool is redundant if using Ruff

[dependency-groups]
dev = [
    "ruff>=0.14.9",
    "vulture>=2.13",
    "django-upgrade>=1.22.2",
]
